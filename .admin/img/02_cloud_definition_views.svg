<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-describedby="desc"><desc id="desc">Five sources emphasize different aspects of cloud computing while sharing a common core.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA9B7"/></marker></defs><line x1="335" y1="162" x2="470" y2="245" stroke="#9AA9B7" stroke-width="3" marker-end="url(#arrow)"/><line x1="700" y1="150" x2="700" y2="180" stroke="#9AA9B7" stroke-width="3" marker-end="url(#arrow)"/><line x1="1065" y1="162" x2="930" y2="245" stroke="#9AA9B7" stroke-width="3" marker-end="url(#arrow)"/><line x1="430" y1="610" x2="500" y2="540" stroke="#9AA9B7" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" y1="610" x2="900" y2="540" stroke="#9AA9B7" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="180" width="510" height="380" rx="30" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="4"/><text x="700" y="230" text-anchor="middle" font-size="30" font-weight="500" fill="#173B7A"><tspan x="700" dy="0">Shared core</tspan></text><text x="500" y="285" text-anchor="start" font-size="23" font-weight="400" fill="#18324A"><tspan x="500" dy="0">Network-accessible services</tspan><tspan x="500" dy="48">On-demand provisioning</tspan><tspan x="500" dy="48">Shared or pooled resources</tspan><tspan x="500" dy="48">Scalability and elasticity</tspan><tspan x="500" dy="48">Measurement and provider relationship</tspan></text><rect x="55" y="32" width="330" height="130" rx="22" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="79" y="75" text-anchor="start" font-size="24" font-weight="500" fill="#18324A"><tspan x="79" dy="0">NIST [1]</tspan></text><text x="79" y="109" text-anchor="start" font-size="19" font-weight="400" fill="#42566A"><tspan x="79" dy="0">Structured taxonomy</tspan><tspan x="79" dy="25">Characteristics and models</tspan></text><rect x="535" y="20" width="330" height="130" rx="22" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="3"/><text x="559" y="63" text-anchor="start" font-size="24" font-weight="500" fill="#18324A"><tspan x="559" dy="0">ISO [2]</tspan></text><text x="559" y="97" text-anchor="start" font-size="19" font-weight="400" fill="#42566A"><tspan x="559" dy="0">Common vocabulary</tspan><tspan x="559" dy="25">Consistent terminology</tspan></text><rect x="1015" y="32" width="330" height="130" rx="22" fill="#FFFFFF" stroke="#28A58C" stroke-width="3"/><text x="1039" y="75" text-anchor="start" font-size="24" font-weight="500" fill="#18324A"><tspan x="1039" dy="0">Berkeley [3]</tspan></text><text x="1039" y="109" text-anchor="start" font-size="19" font-weight="400" fill="#42566A"><tspan x="1039" dy="0">Elasticity and economics</tspan><tspan x="1039" dy="25">Pay-per-use services</tspan></text><rect x="110" y="610" width="360" height="130" rx="22" fill="#FFFFFF" stroke="#D66A3A" stroke-width="3"/><text x="134" y="653" text-anchor="start" font-size="24" font-weight="500" fill="#18324A"><tspan x="134" dy="0">Vaquero et al. [4]</tspan></text><text x="134" y="687" text-anchor="start" font-size="19" font-weight="400" fill="#42566A"><tspan x="134" dy="0">Consensus definition</tspan><tspan x="134" dy="25">Virtualized and scalable</tspan></text><rect x="930" y="610" width="360" height="130" rx="22" fill="#FFFFFF" stroke="#B14D8D" stroke-width="3"/><text x="954" y="653" text-anchor="start" font-size="24" font-weight="500" fill="#18324A"><tspan x="954" dy="0">Buyya et al. [5]</tspan></text><text x="954" y="687" text-anchor="start" font-size="19" font-weight="400" fill="#42566A"><tspan x="954" dy="0">Computing as a utility</tspan><tspan x="954" dy="25">SLA and quality of service</tspan></text></svg>
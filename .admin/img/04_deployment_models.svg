<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1400" height="750" viewBox="0 95 1400 750" role="img" aria-describedby="desc"><desc id="desc">Public, private, community, and hybrid cloud topologies compared in four panels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F8192"/></marker></defs><rect x="55" y="120" width="620" height="325" rx="24" fill="#FFFFFF" stroke="#D4DDE6" stroke-width="2"/><text x="81" y="162" text-anchor="start" font-size="27" font-weight="500" fill="#18324A">Public cloud</text><text x="81" y="190" text-anchor="start" font-size="18" font-weight="400" fill="#5D7083">Open use through a cloud provider</text><rect x="725" y="120" width="620" height="325" rx="24" fill="#FFFFFF" stroke="#D4DDE6" stroke-width="2"/><text x="751" y="162" text-anchor="start" font-size="27" font-weight="500" fill="#18324A">Private cloud</text><text x="751" y="190" text-anchor="start" font-size="18" font-weight="400" fill="#5D7083">Exclusive use by one organization</text><rect x="55" y="485" width="620" height="325" rx="24" fill="#FFFFFF" stroke="#D4DDE6" stroke-width="2"/><text x="81" y="527" text-anchor="start" font-size="27" font-weight="500" fill="#18324A">Community cloud</text><text x="81" y="555" text-anchor="start" font-size="18" font-weight="400" fill="#5D7083">Shared requirements and governance</text><rect x="725" y="485" width="620" height="325" rx="24" fill="#FFFFFF" stroke="#D4DDE6" stroke-width="2"/><text x="751" y="527" text-anchor="start" font-size="27" font-weight="500" fill="#18324A">Hybrid cloud</text><text x="751" y="555" text-anchor="start" font-size="18" font-weight="400" fill="#5D7083">Distinct clouds connected together</text><circle cx="155" cy="235" r="31" fill="#E8F1FF" stroke="#4B78C2" stroke-width="2"/><text x="155" y="242" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Org A</text><line x1="190" y1="235" x2="370" y2="305" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><circle cx="155" cy="305" r="31" fill="#E8F1FF" stroke="#4B78C2" stroke-width="2"/><text x="155" y="312" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Org B</text><line x1="190" y1="305" x2="370" y2="305" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><circle cx="155" cy="375" r="31" fill="#E8F1FF" stroke="#4B78C2" stroke-width="2"/><text x="155" y="382" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Org C</text><line x1="190" y1="375" x2="370" y2="305" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="235" width="225" height="140" rx="30" fill="#DDF5EE" stroke="#28A58C" stroke-width="2"/><text x="497.5" y="312.0" text-anchor="middle" font-size="20" font-weight="500" fill="#18324A">Provider cloud</text><text x="497" y="403" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">Unrelated consumers share pooled resources</text><rect x="785" y="205" width="500" height="200" rx="18" fill="#F4F7FB" stroke="#6D5BD0" stroke-width="2" stroke-dasharray="8 6"/><text x="805" y="232" text-anchor="start" font-size="17" font-weight="500" fill="#6D5BD0">Organization boundary</text><circle cx="860" cy="300" r="31" fill="#F0ECFF" stroke="#4B78C2" stroke-width="2"/><text x="860" y="307" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Dept A</text><circle cx="860" cy="365" r="31" fill="#F0ECFF" stroke="#4B78C2" stroke-width="2"/><text x="860" y="372" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Dept B</text><line x1="895" y1="300" x2="1035" y2="315" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><line x1="895" y1="365" x2="1035" y2="335" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><rect x="1050" y="270" width="200" height="110" rx="30" fill="#EEE9FF" stroke="#28A58C" stroke-width="2"/><text x="1150.0" y="332.0" text-anchor="middle" font-size="20" font-weight="500" fill="#18324A">Private cloud</text><circle cx="155" cy="640" r="31" fill="#FFF0DE" stroke="#4B78C2" stroke-width="2"/><text x="155" y="647" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Univ A</text><line x1="190" y1="640" x2="410" y2="690" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><circle cx="155" cy="735" r="31" fill="#FFF0DE" stroke="#4B78C2" stroke-width="2"/><text x="155" y="742" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Univ B</text><line x1="190" y1="735" x2="410" y2="690" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><circle cx="360" cy="775" r="31" fill="#FFF0DE" stroke="#4B78C2" stroke-width="2"/><text x="360" y="782" text-anchor="middle" font-size="17" font-weight="500" fill="#18324A">Univ C</text><line x1="395" y1="775" x2="410" y2="690" stroke="#6F8192" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="620" width="220" height="145" rx="30" fill="#FFF0DE" stroke="#28A58C" stroke-width="2"/><text x="530.0" y="699.5" text-anchor="middle" font-size="20" font-weight="500" fill="#18324A">Community cloud</text><rect x="785" y="625" width="205" height="130" rx="30" fill="#EEE9FF" stroke="#28A58C" stroke-width="2"/><text x="887.5" y="697.0" text-anchor="middle" font-size="20" font-weight="500" fill="#18324A">Private cloud</text><rect x="1135" y="625" width="205" height="130" rx="30" fill="#DDF5EE" stroke="#28A58C" stroke-width="2"/><text x="1237.5" y="697.0" text-anchor="middle" font-size="20" font-weight="500" fill="#18324A">Public cloud</text><line x1="1000" y1="675" x2="1125" y2="675" stroke="#D66A3A" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><line x1="1125" y1="715" x2="1000" y2="715" stroke="#D66A3A" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><text x="1062" y="648" text-anchor="middle" font-size="18" font-weight="500" fill="#B4522C">Cloud bursting</text><text x="1062" y="790" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">Data and applications move through compatible interfaces</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1400" height="540" viewBox="0 100 1400 540" role="img" aria-describedby="desc"><desc id="desc">The API accepts a job and returns an identifier before a worker completes or fails the job.</desc><defs><marker id="arrow-2F6BFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6BFF"/></marker><marker id="arrow-D66A3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D66A3A"/></marker></defs><rect x="90" y="120" width="210" height="90" rx="22" fill="#FFF0DE" stroke="#E49A3A" stroke-width="3"/><text x="195.0" y="160" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Client</text><text x="195.0" y="190" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">submits an image</text><rect x="455" y="120" width="250" height="90" rx="22" fill="#E8F1FF" stroke="#4B78C2" stroke-width="3"/><text x="580.0" y="160" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">API</text><text x="580.0" y="190" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">creates a job identifier</text><line x1="300" y1="150" x2="445" y2="150" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><text x="372.5" y="134.0" text-anchor="middle" font-size="17" font-weight="500" fill="#2F6BFF">POST /images</text><line x1="455" y1="195" x2="310" y2="195" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><text x="382.5" y="223.0" text-anchor="middle" font-size="17" font-weight="500" fill="#2F6BFF">202 Accepted + job ID</text><rect x="90" y="255" width="615" height="62" rx="16" fill="#FFFFFF" stroke="#9AA9B7" stroke-width="2" stroke-dasharray="8 6"/><text x="397" y="282" text-anchor="middle" font-size="19" font-weight="500" fill="#42566A">GET /jobs/{id}</text><text x="397" y="305" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">pending / processing / completed / failed</text><path d="M 580 220 L 580 355 L 215 355 L 215 390" fill="none" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><rect x="80" y="400" width="235" height="100" rx="22" fill="#E8F1FF" stroke="#4B78C2" stroke-width="3"/><text x="197.5" y="440" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Accepted</text><text x="197.5" y="470" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">job ID created</text><rect x="400" y="400" width="235" height="100" rx="22" fill="#FFF0DE" stroke="#D66A3A" stroke-width="3"/><text x="517.5" y="440" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Queued</text><text x="517.5" y="470" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">waiting for a worker</text><rect x="720" y="400" width="235" height="100" rx="22" fill="#FFF0DE" stroke="#D66A3A" stroke-width="3"/><text x="837.5" y="440" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Processing</text><text x="837.5" y="470" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">worker owns the job</text><rect x="1045" y="355" width="250" height="100" rx="22" fill="#E8F7F3" stroke="#28A58C" stroke-width="3"/><text x="1170.0" y="395" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Completed</text><text x="1170.0" y="425" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">result location stored</text><rect x="1045" y="520" width="250" height="100" rx="22" fill="#FCE8E6" stroke="#D65745" stroke-width="3"/><text x="1170.0" y="560" text-anchor="middle" font-size="24" font-weight="500" fill="#18324A">Failed</text><text x="1170.0" y="590" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">error recorded or retried</text><line x1="315" y1="450" x2="390" y2="450" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><line x1="635" y1="450" x2="710" y2="450" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><line x1="955" y1="435" x2="1035" y2="405" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><text x="995.0" y="402.0" text-anchor="middle" font-size="17" font-weight="500" fill="#2F6BFF">success</text><line x1="955" y1="475" x2="1035" y2="555" stroke="#D66A3A" stroke-width="4" marker-end="url(#arrow-D66A3A)"/><text x="995.0" y="533.0" text-anchor="middle" font-size="17" font-weight="500" fill="#D66A3A">error</text><rect x="80" y="560" width="875" height="62" rx="15" fill="#EAF1FF" stroke="#A9C2F5" stroke-width="2"/><text x="517" y="599" text-anchor="middle" font-size="20" font-weight="500" fill="#244D9B">202 Accepted confirms that the job was accepted - it does not confirm successful processing.</text></svg>
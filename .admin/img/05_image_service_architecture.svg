<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1600" height="750" viewBox="0 105 1600 750" role="img" aria-describedby="desc"><desc id="desc">The synchronous upload path and asynchronous processing path through the cloud application.</desc><defs><marker id="arrow-2F6BFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6BFF"/></marker><marker id="arrow-D66A3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D66A3A"/></marker><marker id="arrow-28A58C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28A58C"/></marker></defs><rect x="245" y="125" width="1305" height="650" rx="30" fill="#FFFFFF" stroke="#A8B8C7" stroke-width="3" stroke-dasharray="10 8"/><text x="275" y="163" text-anchor="start" font-size="20" font-weight="500" fill="#5D7083">Cloud application boundary</text><rect x="45" y="265" width="155" height="100" rx="20" fill="#FFF0DE" stroke="#E49A3A" stroke-width="3"/><text x="122.5" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Client</text><text x="122.5" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">uploads image</text><rect x="285" y="265" width="205" height="100" rx="20" fill="#FFFFFF" stroke="#4B78C2" stroke-width="3"/><text x="387.5" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Public endpoint</text><text x="387.5" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">DNS + HTTPS</text><rect x="555" y="265" width="205" height="100" rx="20" fill="#FFFFFF" stroke="#4B78C2" stroke-width="3"/><text x="657.5" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Load balancer</text><text x="657.5" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">selects API instance</text><rect x="825" y="265" width="190" height="100" rx="20" fill="#FFFFFF" stroke="#4B78C2" stroke-width="3"/><text x="920.0" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">API</text><text x="920.0" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">validates + creates job</text><rect x="1090" y="265" width="190" height="100" rx="20" fill="#FFF0DE" stroke="#D66A3A" stroke-width="3"/><text x="1185.0" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Work queue</text><text x="1185.0" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">stores pending jobs</text><rect x="1350" y="265" width="155" height="100" rx="20" fill="#FFF0DE" stroke="#D66A3A" stroke-width="3"/><text x="1427.5" y="307" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Workers</text><text x="1427.5" y="337" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">process images</text><rect x="780" y="555" width="240" height="105" rx="20" fill="#E8F7F3" stroke="#28A58C" stroke-width="3"/><text x="900.0" y="597" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Input storage</text><text x="900.0" y="627" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">original images</text><rect x="1285" y="555" width="250" height="105" rx="20" fill="#E8F7F3" stroke="#28A58C" stroke-width="3"/><text x="1410.0" y="597" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Result storage</text><text x="1410.0" y="627" text-anchor="middle" font-size="17" font-weight="400" fill="#5D7083">processed images</text><line x1="200" y1="315" x2="275" y2="315" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><text x="237.5" y="299.0" text-anchor="middle" font-size="17" font-weight="500" fill="#2F6BFF">HTTPS</text><line x1="490" y1="315" x2="545" y2="315" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><line x1="760" y1="315" x2="815" y2="315" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><line x1="1015" y1="315" x2="1080" y2="315" stroke="#D66A3A" stroke-width="4" marker-end="url(#arrow-D66A3A)" stroke-dasharray="10 7"/><text x="1047.5" y="299.0" text-anchor="middle" font-size="17" font-weight="500" fill="#D66A3A">enqueue</text><line x1="1280" y1="315" x2="1340" y2="315" stroke="#D66A3A" stroke-width="4" marker-end="url(#arrow-D66A3A)" stroke-dasharray="10 7"/><text x="1310.0" y="299.0" text-anchor="middle" font-size="17" font-weight="500" fill="#D66A3A">consume</text><line x1="920" y1="375" x2="900" y2="545" stroke="#28A58C" stroke-width="4" marker-end="url(#arrow-28A58C)"/><text x="910.0" y="452.0" text-anchor="middle" font-size="17" font-weight="500" fill="#28A58C">store image</text><line x1="1428" y1="375" x2="1415" y2="545" stroke="#28A58C" stroke-width="4" marker-end="url(#arrow-28A58C)"/><text x="1421.5" y="452.0" text-anchor="middle" font-size="17" font-weight="500" fill="#28A58C">write result</text><path d="M 1350 345 C 1220 470, 1080 505, 1020 600" fill="none" stroke="#28A58C" stroke-width="4" marker-end="url(#arrow-28A58C)"/><text x="1170" y="485" text-anchor="middle" font-size="17" font-weight="500" fill="#28A58C">load original</text><path d="M 825 245 L 825 205 L 125 205 L 125 255" fill="none" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-2F6BFF)"/><text x="475" y="192" text-anchor="middle" font-size="17" font-weight="500" fill="#2F6BFF">202 Accepted + job identifier</text><line x1="350" y1="727" x2="425" y2="727" stroke="#2F6BFF" stroke-width="4"/><text x="440" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#18324A">Synchronous HTTP</text><line x1="650" y1="727" x2="725" y2="727" stroke="#D66A3A" stroke-width="4" stroke-dasharray="10 7"/><text x="740" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#18324A">Asynchronous work</text><line x1="955" y1="727" x2="1030" y2="727" stroke="#28A58C" stroke-width="4"/><text x="1045" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#18324A">Image and result data</text><text x="800" y="818" text-anchor="middle" font-size="20" font-weight="500" fill="#42566A">The client sees a stable service; the API instances, queue, workers and storage remain internal.</text></svg>
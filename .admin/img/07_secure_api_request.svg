<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" width="1500" height="945" viewBox="0 95 1500 945" role="img" aria-describedby="desc"><desc id="desc">A sequence separating DNS, TLS, token authentication, authorization, and the API operation.</desc><defs><marker id="arrow-dns" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F8192"/></marker><marker id="arrow-tls" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6BFF"/></marker><marker id="arrow-identity" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D5BD0"/></marker><marker id="arrow-authorization" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D66A3A"/></marker><marker id="arrow-application" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28A58C"/></marker></defs><rect x="65" y="115" width="210" height="82" rx="20" fill="#FFFFFF" stroke="#9AA9B7" stroke-width="3"/><text x="170" y="150" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Client</text><text x="170" y="177" text-anchor="middle" font-size="16" font-weight="400" fill="#5D7083">mobile or web app</text><line x1="170" y1="197" x2="170" y2="945" stroke="#B8C3CE" stroke-width="2" stroke-dasharray="8 8"/><rect x="400" y="115" width="210" height="82" rx="20" fill="#FFFFFF" stroke="#9AA9B7" stroke-width="3"/><text x="505" y="150" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">DNS resolver</text><text x="505" y="177" text-anchor="middle" font-size="16" font-weight="400" fill="#5D7083">locates the service</text><line x1="505" y1="197" x2="505" y2="945" stroke="#B8C3CE" stroke-width="2" stroke-dasharray="8 8"/><rect x="785" y="115" width="210" height="82" rx="20" fill="#FFFFFF" stroke="#9AA9B7" stroke-width="3"/><text x="890" y="150" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">Identity provider</text><text x="890" y="177" text-anchor="middle" font-size="16" font-weight="400" fill="#5D7083">issues access token</text><line x1="890" y1="197" x2="890" y2="945" stroke="#B8C3CE" stroke-width="2" stroke-dasharray="8 8"/><rect x="1165" y="115" width="210" height="82" rx="20" fill="#FFFFFF" stroke="#9AA9B7" stroke-width="3"/><text x="1270" y="150" text-anchor="middle" font-size="23" font-weight="500" fill="#18324A">API service</text><text x="1270" y="177" text-anchor="middle" font-size="16" font-weight="400" fill="#5D7083">protects the resource</text><line x1="1270" y1="197" x2="1270" y2="945" stroke="#B8C3CE" stroke-width="2" stroke-dasharray="8 8"/><circle cx="134" cy="240" r="17" fill="#6F8192"/><text x="134" y="246" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">1</text><line x1="170" y1="240" x2="505" y2="240" stroke="#6F8192" stroke-width="4" marker-end="url(#arrow-dns)"/><text x="337.5" y="227" text-anchor="middle" font-size="18" font-weight="500" fill="#6F8192">Resolve service name</text><circle cx="134" cy="300" r="17" fill="#6F8192"/><text x="134" y="306" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">2</text><line x1="505" y1="300" x2="170" y2="300" stroke="#6F8192" stroke-width="4" marker-end="url(#arrow-dns)"/><text x="337.5" y="287" text-anchor="middle" font-size="18" font-weight="500" fill="#6F8192">Return IP address</text><circle cx="134" cy="380" r="17" fill="#2F6BFF"/><text x="134" y="386" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">3</text><line x1="170" y1="380" x2="1270" y2="380" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-tls)"/><text x="720.0" y="367" text-anchor="middle" font-size="18" font-weight="500" fill="#2F6BFF">TLS ClientHello and key exchange</text><circle cx="134" cy="445" r="17" fill="#2F6BFF"/><text x="134" y="451" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">4</text><line x1="1270" y1="445" x2="170" y2="445" stroke="#2F6BFF" stroke-width="4" marker-end="url(#arrow-tls)"/><text x="720.0" y="432" text-anchor="middle" font-size="18" font-weight="500" fill="#2F6BFF">Certificate and handshake authentication</text><circle cx="177" cy="509" r="17" fill="#2F6BFF"/><text x="177" y="515" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">5</text><rect x="205" y="475" width="300" height="70" rx="17" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="223" y="504" text-anchor="start" font-size="19" font-weight="500" fill="#2F6BFF">Validate certificate</text><text x="223" y="529" text-anchor="start" font-size="16" font-weight="400" fill="#5D7083">chain, service name and validity</text><circle cx="134" cy="600" r="17" fill="#6D5BD0"/><text x="134" y="606" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">6</text><line x1="170" y1="600" x2="890" y2="600" stroke="#6D5BD0" stroke-width="4" marker-end="url(#arrow-identity)"/><text x="530.0" y="587" text-anchor="middle" font-size="18" font-weight="500" fill="#6D5BD0">Request delegated access</text><circle cx="134" cy="660" r="17" fill="#6D5BD0"/><text x="134" y="666" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">7</text><line x1="890" y1="660" x2="170" y2="660" stroke="#6D5BD0" stroke-width="4" marker-end="url(#arrow-identity)"/><text x="530.0" y="647" text-anchor="middle" font-size="18" font-weight="500" fill="#6D5BD0">Return access token</text><circle cx="134" cy="745" r="17" fill="#6D5BD0"/><text x="134" y="751" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">8</text><line x1="170" y1="745" x2="1270" y2="745" stroke="#6D5BD0" stroke-width="4" marker-end="url(#arrow-identity)"/><text x="720.0" y="732" text-anchor="middle" font-size="18" font-weight="500" fill="#6D5BD0">Encrypted HTTP request + access token</text><circle cx="902" cy="814" r="17" fill="#6D5BD0"/><text x="902" y="820" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">9</text><rect x="930" y="780" width="300" height="70" rx="17" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="3"/><text x="948" y="809" text-anchor="start" font-size="19" font-weight="500" fill="#6D5BD0">Validate token</text><text x="948" y="834" text-anchor="start" font-size="16" font-weight="400" fill="#5D7083">signature, issuer, audience and expiry</text><circle cx="902" cy="899" r="17" fill="#D66A3A"/><text x="902" y="905" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">10</text><rect x="930" y="865" width="300" height="70" rx="17" fill="#FFFFFF" stroke="#D66A3A" stroke-width="3"/><text x="948" y="894" text-anchor="start" font-size="19" font-weight="500" fill="#D66A3A">Authorize operation</text><text x="948" y="919" text-anchor="start" font-size="16" font-weight="400" fill="#5D7083">is this identity allowed to act?</text><circle cx="134" cy="970" r="17" fill="#28A58C"/><text x="134" y="976" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">11</text><line x1="1270" y1="970" x2="170" y2="970" stroke="#28A58C" stroke-width="4" marker-end="url(#arrow-application)"/><text x="720.0" y="957" text-anchor="middle" font-size="18" font-weight="500" fill="#28A58C">Execute operation and return encrypted response</text><rect x="140" y="995" width="1220" height="32" rx="12" fill="#FFFFFF" stroke="#D4DDE6" stroke-width="1"/><circle cx="235" cy="1011" r="8" fill="#6F8192"/><text x="252" y="1017" text-anchor="start" font-size="16" font-weight="400" fill="#42566A">DNS</text><circle cx="480" cy="1011" r="8" fill="#2F6BFF"/><text x="497" y="1017" text-anchor="start" font-size="16" font-weight="400" fill="#42566A">TLS and PKI</text><circle cx="725" cy="1011" r="8" fill="#6D5BD0"/><text x="742" y="1017" text-anchor="start" font-size="16" font-weight="400" fill="#42566A">Token authentication</text><circle cx="970" cy="1011" r="8" fill="#D66A3A"/><text x="987" y="1017" text-anchor="start" font-size="16" font-weight="400" fill="#42566A">Authorization</text><circle cx="1215" cy="1011" r="8" fill="#28A58C"/><text x="1232" y="1017" text-anchor="start" font-size="16" font-weight="400" fill="#42566A">API operation</text></svg>
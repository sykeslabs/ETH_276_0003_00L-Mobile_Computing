<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">PID controller with three parallel branches and negative feedback</title>
<desc id="desc">The setpoint r(t) minus measured output y(t) produces error e(t). Proportional, integral, and derivative branches process the same error. Their outputs are added to produce control input u(t), which drives the system. The measured output returns to the negative input of the error summing junction.</desc>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
html{overflow:hidden}
*{box-sizing:border-box}body{margin:0;background:#0c1527;color:#e5edf8;font:14px system-ui,sans-serif}
.wrap{padding:16px;border:1px solid #304261;border-radius:12px;background:linear-gradient(140deg,#12213a,#0b1323)}
.top,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top{justify-content:space-between}
h2{font-size:18px;margin:0}#status{color:#b6c9e7;font-size:13px;min-height:20px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 2px}
.meter{border:1px solid #304261;border-radius:8px;padding:8px 12px;background:#0c192e}
.meter span{display:block;color:#b0c2dc;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.meter strong{display:block;margin-top:3px;font-size:19px;font-variant-numeric:tabular-nums;font-weight:600}
svg{width:100%;display:block}svg text{font-family:system-ui,sans-serif;fill:#acbfdc;font-size:11px}
button,select{font:inherit;border:1px solid #526a8c;border-radius:6px;color:#eaf2ff;background:#203655;padding:7px 12px;cursor:pointer}
button:hover,button:focus-visible{background:#305780}#play{min-width:82px;background:#17626a;border-color:#48b8be}
input[type=range]{min-width:140px;flex:1;accent-color:#61d4d7;cursor:pointer}
#clock{min-width:108px;font-variant-numeric:tabular-nums;font-size:12px;color:#cbd9ee}
.audio-controls{margin-top:10px}#volume{flex:0 1 110px;min-width:80px;width:110px}#volumeValue{font-size:12px;color:#b6c9e7}
@media(max-width:600px){.meters{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.meter strong{font-size:16px}}
</style></head><body><div class="wrap">

byId('zoomPad').setAttribute('x', closeX(-flight.pad));
byId('zoomPad').setAttribute('width', 32 * flight.pad);
for (let n = 0; n <= 4; n++) {
 const height = flight.ymax * n / 4, y = mapY(height);
 const line = document.createElementNS(svgNS, 'path');

 line.setAttribute('stroke-opacity', '.5'); byId('grid').appendChild(line);

configureScene(true);

// Sound plays locally; applause uses a bundled recording. A click can unlock browser audio.
let audio = null, soundEnabled = true, effectHandle = null;

function smooth(param, value, seconds = 0.035) {

}
function setMasterVolume() {
 if (audio) smooth(audio.master.gain, soundEnabled ? Number(byId('volume').value) / 100 * 0.65 : 0);
 byId('volumeValue').textContent = `${byId('volume').value}%`;
 byId('sound').textContent = soundEnabled ? 'Sound: on' : 'Sound: off';

}
function updateEngine(thrust) {

 smooth(audio.engineGain.gain, throttle > 0.001 ? 0.65 * Math.sqrt(throttle) : 0);

function tone(frequency, start, length, amplitude) {

function playOutcomeSound() {

}
function stopCueSounds() {

}
async function activateAudio() {

  if (!AudioContextClass) throw new Error('Web Audio unavailable');

  const graph = audio;
  setMasterVolume();

  await graph.context.resume();
  if (audio !== graph || graph.context.state !== 'running') return;
  setMasterVolume();

}
byId('sound').onclick = () => {
 soundEnabled = !soundEnabled; setMasterVolume();

  updateEngine(0); stopCueSounds();
  if (awaitingSound) beginReplay();

};
// One interaction unlocks this player for all subsequent gain-slider updates.
for (const type of ['click', 'keydown']) document.addEventListener(type, event => {
 if (soundEnabled && !event.target.closest('button, input, select')) activateAudio();
});
byId('volume').oninput = () => { setMasterVolume(); if (soundEnabled) activateAudio(); };

// Short visual explosion; it does not modify the simulation or landing criteria.
function createExplosion(id) {
 const group = byId(id);
 const circle = (color, radius) => {
  const node = document.createElementNS(svgNS, 'circle');
  node.setAttribute('fill', color); node.setAttribute('r', radius); group.appendChild(node); return node;
 };
 const smoke = Array.from({length: 5}, () => circle('#8996a3', 10));
 const glow = circle('#ff843a', 18), core = circle('#ffe8a0', 10);

}
const explosions = [createExplosion('explosion'), createExplosion('zoomExplosion')];
function drawExplosion(progress) {
 const failedContact = elapsed >= duration && flight.contact && !flight.success;
 explosions.forEach((parts, i) => {
  parts.group.setAttribute('visibility', failedContact ? 'visible' : 'hidden');
  if (!failedContact) return;
  const x = i ? closeX(last[1]) : mapX(last[1]), y = i ? closeY(last[2]) : mapY(last[2]);
  parts.group.setAttribute('transform', `translate(${x},${y - 12}) scale(${i ? 1.25 : 1})`);
  const fire = Math.max(0, 1 - progress * 1.8);
  parts.glow.setAttribute('r', 8 + progress * 55); parts.glow.setAttribute('opacity', fire * 0.9);
  parts.core.setAttribute('r', 4 + progress * 29); parts.core.setAttribute('opacity', fire);
  parts.smoke.forEach((node, j) => {
   node.setAttribute('cx', (j - 2) * (5 + progress * 7));
   node.setAttribute('cy', -progress * (13 + (j % 2) * 10));
   node.setAttribute('r', 7 + progress * 9);
   node.setAttribute('opacity', (1 - progress * 0.6) * 0.45);
  });
  parts.sparks.forEach((node, j) => {
   const angle = Math.PI * (0.12 + j / 10), distance = 12 + progress * 63;
   node.setAttribute('cx', Math.cos(angle) * distance);
   node.setAttribute('cy', -Math.sin(angle) * distance + progress * progress * 28);
   node.setAttribute('opacity', 1 - progress);
  });

}
function stopEffects() {

}
function finishReplay() {

  const progress = Math.min(1, (now - started) / 1100);
  drawExplosion(progress);
  effectHandle = progress < 1 ? requestAnimationFrame(animate) : null;

}

function sample(t) {
 let lo = 0, hi = frames.length - 1;
 while (lo + 1 < hi) { const mid = (lo + hi) >> 1; if (frames[mid][0] <= t) lo = mid; else hi = mid; }
 const a = frames[lo], b = frames[hi];
 const fraction = Math.max(0, Math.min(1, (t - a[0]) / Math.max(1e-9, b[0] - a[0])));

}
function pathTo(index, state, xMap, yMap) {

}

  const ripple = strength * (3 + 3 * strength) * u * Math.sin(time * 13 - u * 5.5);

 const cross = [[.4,.2],[.6,.2],[.6,.4],[.8,.4],[.8,.6],[.6,.6],
                [.6,.8],[.4,.8],[.4,.6],[.2,.6],[.2,.4],[.4,.4]];

  const b = cross[(i + 1) % cross.length];
  for (let j = 0; j < 4; j++) crossPoints.push(point(a[0] + (b[0] - a[0]) * j / 4,
                                                   a[1] + (b[1] - a[1]) * j / 4));

 byId('windFlag').setAttribute('aria-label', calm ? 'Swiss flag: calm wind' :
  `Swiss flag: wind push ${Math.abs(wind).toFixed(2)} metres per second squared to the ${wind < 0 ? 'left' : 'right'}, smoothed`);
}

function render() {
 const {state, index} = sample(elapsed);
 const [t, x, y, vx, vy, thrust, angle, wind] = state, finished = elapsed >= duration;
 renderWindFlag(wind, t);
 const degrees = angle * 180 / Math.PI;
 byId('rocket').setAttribute('transform', `translate(${mapX(x)},${mapY(y)}) rotate(${degrees})`);
 byId('zoomRocket').setAttribute('transform', `translate(${closeX(x)},${closeY(y)}) rotate(${degrees}) scale(1.25)`);
 const failedContact = finished && flight.contact && !flight.success;
 byId('rocket').setAttribute('visibility', failedContact ? 'hidden' : 'visible');
 byId('zoomRocket').setAttribute('visibility', failedContact ? 'hidden' : 'visible');
 drawExplosion(1);
 const activeThrust = finished && flight.contact ? 0 : thrust;
 updateEngine(activeThrust);
 document.querySelectorAll('.flame').forEach(flame => {
  flame.setAttribute('opacity', activeThrust > 0.05 ? 1 : 0);
  flame.setAttribute('transform', `scale(1,${0.2 + activeThrust / flight.maxThrust * (1 + 0.08 * Math.sin(t * 30))})`);

 byId('trail').setAttribute('d', pathTo(index, state, mapX, mapY));
 byId('zoomTrail').setAttribute('d', pathTo(index, state, closeX, closeY));
 byId('height').textContent = `${y.toFixed(1)} m`;
 byId('vertical').textContent = `${vy.toFixed(2)} m/s`;
 byId('offset').textContent = `${x.toFixed(2)} m`;
 byId('sideways').textContent = `${vx.toFixed(2)} m/s`;
 byId('engine').textContent = `Thrust ${thrust.toFixed(1)} N   ·   Tilt ${degrees.toFixed(1)}°`;
 byId('clock').textContent = `${elapsed.toFixed(1)} / ${duration.toFixed(1)} s`;
 byId('seek').value = String(duration ? elapsed / duration * 1000 : 0);
 byId('zoomHint').textContent = y > 14 ? 'Rocket above the close-up' : Math.abs(x) > 9 ? 'Rocket outside the close-up' : '';
 byId('status').textContent = awaitingSound ? 'Ready for descent' : finished ? flight.outcome : playing ? 'Descent in progress' : elapsed === 0 ? 'Ready for descent' : 'Replay paused';
 byId('status').style.color = finished ? (flight.success ? '#6ce3ad' : '#ffad96') : '#b6c9e7';
 byId('impact').setAttribute('cx', mapX(x));
 byId('impact').setAttribute('stroke', flight.success ? '#6ce3ad' : '#ff876e');
 byId('impact').setAttribute('visibility', finished && flight.contact ? 'visible' : 'hidden');

}
function pause() {

}
function tick(stamp) {

}
function beginReplay() {

}
byId('play').onclick = () => {

  awaitingSound = true; render(); activateAudio();

};
byId('restart').onclick = () => { stopEffects(); pause(); elapsed = 0; render(); };
byId('seek').oninput = () => { const fraction = Number(byId('seek').value) / 1000; stopEffects(); pause(); elapsed = fraction * duration; render(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopEffects(); pause(); } });
window.addEventListener('pagehide', () => { stopEffects(); pause(); if (audio) audio.context.close(); });
function loadAttempt(next) {
 stopEffects(); pause();

 elapsed = 0;

}
window.addEventListener('message', event => {
 const message = event.data;
 if (!replayChannel || !message || message.type !== 'rocket-flight-update' ||
     message.channel !== replayChannel || !event.source || event.source.parent !== window.parent ||
     !Number.isInteger(message.revision) || !Array.isArray(message.flight?.frames)) return;

  loadAttempt(message.flight); lastRevision = message.revision;

});
// Fit the notebook iframe to the actual content, including wrapped controls.
function reportHeight() {

  height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)}, '*');
}
const sizeObserver = new ResizeObserver(reportHeight);
sizeObserver.observe(document.querySelector('.wrap'));
window.addEventListener('message', event => {

});
window.addEventListener('pagehide', () => sizeObserver.disconnect());
render();
if (flight.autoplay && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) byId('play').click();
